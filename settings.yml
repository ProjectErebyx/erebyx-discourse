# Settings exposed in Discourse admin → Customize → Themes → Erebyx Arche → Settings
# Siarrah and ZENN can tune these without code edits.

brand_violet:
  type: string
  default: "#7503E0"
  description: "Official Nyx Violet. Used for accents, links, and primary energy moments."

brand_blue:
  type: string
  default: "#4492FC"
  description: "Official Architect Blue. Used in gradients with Nyx Violet."

brand_violet_light:
  type: string
  default: "#c4b5fd"
  description: "Lighter violet for highlights, hover states, glows."

brand_gold:
  type: string
  default: "#FAB232"
  description: "Official Arche Amber. Primary accent for Arche surfaces, milestones, founding badges, and special markers."

constellation_glow_strength:
  type: integer
  default: 12
  min: 0
  max: 40
  description: "Strength of subtle violet glow around interactive elements (px)."

show_meander_dividers:
  type: bool
  default: true
  description: "Show Greek meander pattern as section dividers."

show_starfield_backdrop:
  type: bool
  default: true
  description: "Show ambient starfield behind topic pages (disable if it competes with reading)."

genesis_total_seats:
  type: integer
  default: 2000
  min: 1
  max: 100000
  description: "Total Genesis Arche seat count shown in the banner. Update if cohort size changes."

genesis_group_color:
  type: string
  default: "#c4b5fd"
  description: "Username + flair color for Genesis Arche group members."
