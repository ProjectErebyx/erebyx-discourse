name: Sync theme to arche.erebyx.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-theme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DISCOURSE_URL: https://arche.erebyx.com
      THEME_ID: 25

    steps:
      - name: Trigger Discourse remote-theme update
        env:
          API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
          API_USERNAME: ${{ secrets.DISCOURSE_API_USERNAME }}
        run: |
          set -euo pipefail

          if [[ -z "${API_KEY:-}" || -z "${API_USERNAME:-}" ]]; then
            echo "::error::DISCOURSE_API_KEY and DISCOURSE_API_USERNAME secrets must be set on this repo."
            exit 1
          fi

          echo "Triggering Discourse to pull ${GITHUB_SHA} into theme ${THEME_ID}…"

          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X PUT "${DISCOURSE_URL}/admin/themes/${THEME_ID}.json" \
            -H "Api-Key: ${API_KEY}" \
            -H "Api-Username: ${API_USERNAME}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"theme":{"remote_update":true}}')

          if [[ "${http_code}" != "200" ]]; then
            echo "::error::Discourse returned HTTP ${http_code}"
            cat response.json
            exit 1
          fi

          echo "Discourse accepted update request (HTTP 200)."

      - name: Verify theme is at latest commit
        env:
          API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
          API_USERNAME: ${{ secrets.DISCOURSE_API_USERNAME }}
        run: |
          set -euo pipefail

          for attempt in {1..18}; do
            theme=$(curl -sS -X GET "${DISCOURSE_URL}/admin/themes/${THEME_ID}.json" \
              -H "Api-Key: ${API_KEY}" \
              -H "Api-Username: ${API_USERNAME}" \
              -H "Accept: application/json")

            local_version=$(echo "${theme}" | jq -r '.theme.remote_theme.local_version // empty')
            remote_version=$(echo "${theme}" | jq -r '.theme.remote_theme.remote_version // empty')
            commits_behind=$(echo "${theme}" | jq -r '.theme.remote_theme.commits_behind // empty')
            last_error=$(echo "${theme}" | jq -r '.theme.remote_theme.last_error_text // empty')

            echo "Attempt ${attempt}:"
            echo "  Theme local_version  : ${local_version}"
            echo "  Theme remote_version : ${remote_version}"
            echo "  Commits behind       : ${commits_behind}"
            echo "  GITHUB_SHA           : ${GITHUB_SHA}"

            if [[ -n "${last_error}" && "${last_error}" != "null" ]]; then
              echo "::error::Discourse reports last_error_text: ${last_error}"
              exit 1
            fi

            if [[ "${local_version}" == "${GITHUB_SHA}" ]]; then
              echo "Theme is at ${GITHUB_SHA}. Sync complete."
              exit 0
            fi

            sleep 5
          done

          echo "::error::Discourse did not advance theme ${THEME_ID} to ${GITHUB_SHA}."
          exit 1
