  EREBYX Arche — base theme (color scheme + footer + hero).
  Brand Header is supplied by the official discourse-brand-header
  theme component (attached as a child of this theme). Removing
  the prior in-search-bar nav script in favor of the Brand Header
  top strip — single, clean, mobile-responsive, officially maintained.
-->
<!--
  EREBYX Arche — Discourse homepage hero

  Renders a constellation canvas banner above the category list on homepage
  routes only (/, /categories). Self-removes elsewhere so it never
  conflicts with topic threads. Brand colors flow from theme settings via
  CSS custom properties (--erebyx-violet / --erebyx-blue / --erebyx-violet-
  light / --erebyx-gold) — no JS edits required to retune the palette.

  Constellation density tuned lower than the marketing site (90 desktop /
  40 mobile vs site's 100 / 45) so the canvas loop doesn't compete with
  Discourse's Ember render budget. Respects prefers-reduced-motion with a
  static SVG fallback.
-->

<script type="text/x-handlebars" data-template-name="/connectors/discovery-above/erebyx-hero">
  <section class="erebyx-hero" aria-label="The Arche — EREBYX founding community">
    <canvas class="erebyx-hero__canvas" aria-hidden="true"></canvas>
    <noscript>
      <div class="erebyx-hero__static" aria-hidden="true"></div>
    </noscript>
    <div class="erebyx-hero__content">
      <div class="erebyx-hero__sigil" aria-hidden="true">&#x25C8;</div>
      <h1 class="erebyx-hero__title">The Arche</h1>
      <p class="erebyx-hero__tag">
        Founding community of Genesis Arche
        <span class="erebyx-hero__sep">&middot;</span>
        <span class="erebyx-hero__beta">private beta</span>
      </p>
    </div>
    <div class="erebyx-hero__fade" aria-hidden="true"></div>
  </section>
</script>

<script>
  /*
   * EREBYX Arche — Constellation hero bootstrap
   * Pure Canvas API; no Three.js, no GSAP. ~3.8KB minified.
   * Designed to coexist with Ember/Discourse:
   *   - Single requestAnimationFrame loop, paused when tab hidden
   *   - Idempotent — uses a global flag so multiple Discourse rerouters don't double-init
   *   - Self-cleans on page change via api.onPageChange()
   *   - Respects prefers-reduced-motion
   *   - Only mounts on homepage routes
   */
  (function () {
    if (typeof window === "undefined") return;
    if (window.__erebyxHeroBound) return;
    window.__erebyxHeroBound = true;

    var HOME_ROUTES = /^\/(categories|latest|top|hot|unread|new|)?\/?$/;
    var PAUSED = false;
    var rafId = null;

    function isHomePage(url) {
      try {
        var u = new URL(url || window.location.href, window.location.origin);
        return HOME_ROUTES.test(u.pathname);
      } catch (e) {
        return HOME_ROUTES.test(window.location.pathname);
      }
    }

    function readBrandColor(name, fallback) {
      var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || fallback;
    }

    function hexToHsl(hex) {
      // Defensive: returns {h,s,l} in degrees / percent
      var c = hex.replace("#", "");
      if (c.length === 3) c = c.split("").map(function (x) { return x + x; }).join("");
      var r = parseInt(c.substr(0, 2), 16) / 255;
      var g = parseInt(c.substr(2, 2), 16) / 255;
      var b = parseInt(c.substr(4, 2), 16) / 255;
      var max = Math.max(r, g, b), min = Math.min(r, g, b);
      var h = 0, s = 0, l = (max + min) / 2;
      if (max !== min) {
        var d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h *= 60;
      }
      return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    function startHero(canvas) {
      var ctx = canvas.getContext("2d");
      if (!ctx) return null;

      var prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W = 0, H = 0;
      var stars = [];
      var STAR_COUNT = window.innerWidth < 768 ? 40 : 90;
      var CONNECT_DIST = 110;
      // Twinkle speed lowered to MATCH website's calmer feel (website ~0.003, we use 0.0022)
      var TWINKLE_SPEED = 0.0022;

      // Brand-driven color seeds (read from CSS custom properties → fallback to brand defaults)
      var violetHex = readBrandColor("--erebyx-violet", "#7503E0");
      var blueHex = readBrandColor("--erebyx-blue", "#4492FC");
      var lightHex = readBrandColor("--erebyx-violet-light", "#c4b5fd");
      var violetHSL = hexToHsl(violetHex);
      var blueHSL = hexToHsl(blueHex);
      var lightHSL = hexToHsl(lightHex);

      function resize() {
        var rect = canvas.getBoundingClientRect();
        W = rect.width;
        H = rect.height;
        canvas.width = Math.max(1, Math.floor(W * dpr));
        canvas.height = Math.max(1, Math.floor(H * dpr));
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
        // Re-tune star count to viewport
        var newCount = window.innerWidth < 768 ? 40 : 90;
        if (newCount !== STAR_COUNT) {
          STAR_COUNT = newCount;
          stars = [];
        }
        if (stars.length === 0) seed();
      }

      function seed() {
        stars = [];
        for (var i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            // Drift velocity — same magnitude as website (~0.17 px/frame)
            vx: (Math.random() - 0.5) * 0.17,
            vy: (Math.random() - 0.5) * 0.17,
            size: Math.random() * 1.6 + 0.5,
            twinkleOffset: Math.random() * Math.PI * 2,
            // Hue picks one of 3 brand seeds — mostly violet/blue, light highlights ~15%
            hueSeed: Math.random() < 0.15 ? lightHSL : (Math.random() < 0.55 ? violetHSL : blueHSL)
          });
        }
      }

      function draw(now) {
        if (PAUSED) { rafId = requestAnimationFrame(draw); return; }
        ctx.clearRect(0, 0, W, H);

        // Update + draw connections
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          if (!prefersReduced) {
            s.x += s.vx;
            s.y += s.vy;
            // Wrap edges
            if (s.x < -10) s.x = W + 10;
            if (s.x > W + 10) s.x = -10;
            if (s.y < -10) s.y = H + 10;
            if (s.y > H + 10) s.y = -10;
          }

          for (var j = i + 1; j < stars.length; j++) {
            var t = stars[j];
            var dx = s.x - t.x;
            var dy = s.y - t.y;
            var d2 = dx * dx + dy * dy;
            if (d2 < CONNECT_DIST * CONNECT_DIST) {
              var d = Math.sqrt(d2);
              var alpha = (1 - d / CONNECT_DIST) * 0.32;
              if (alpha < 0.02) continue;
              ctx.beginPath();
              ctx.moveTo(s.x, s.y);
              ctx.lineTo(t.x, t.y);
              ctx.strokeStyle = "hsla(" + s.hueSeed.h + ", 50%, 65%, " + alpha + ")";
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }

        // Draw stars (cross + core, matches site star anatomy)
        for (var k = 0; k < stars.length; k++) {
          var p = stars[k];
          var twinkle = prefersReduced ? 0.85
            : Math.sin(now * TWINKLE_SPEED + p.twinkleOffset) * 0.3 + 0.7;
          var spike = p.size * 2.6 * twinkle;
          var hsl = p.hueSeed;

          // Cross spikes
          ctx.globalAlpha = 0.32 * twinkle;
          ctx.strokeStyle = "hsl(" + hsl.h + ", " + Math.max(60, hsl.s) + "%, 65%)";
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(p.x - spike, p.y);
          ctx.lineTo(p.x + spike, p.y);
          ctx.moveTo(p.x, p.y - spike);
          ctx.lineTo(p.x, p.y + spike);
          ctx.stroke();

          // Core
          ctx.globalAlpha = 0.85 * twinkle;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 0.85, 0, Math.PI * 2);
          ctx.fillStyle = "hsl(" + hsl.h + ", " + Math.min(100, hsl.s + 15) + "%, 70%)";
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        rafId = requestAnimationFrame(draw);
      }

      var ro = ("ResizeObserver" in window) ? new ResizeObserver(resize) : null;
      if (ro) ro.observe(canvas);
      window.addEventListener("resize", resize, { passive: true });

      resize();
      rafId = requestAnimationFrame(draw);

      return {
        destroy: function () {
          if (rafId) cancelAnimationFrame(rafId);
          if (ro) ro.disconnect();
          window.removeEventListener("resize", resize);
        }
      };
    }

    // Pause loop when tab is hidden — saves CPU & avoids fighting Discourse polling
    document.addEventListener("visibilitychange", function () {
      PAUSED = document.hidden;
    });

    var heroInstance = null;

    function mount() {
      // Only mount on homepage
      if (!isHomePage()) {
        if (heroInstance) { heroInstance.destroy(); heroInstance = null; }
        var existing = document.querySelector(".erebyx-hero");
        if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
        return;
      }
      var canvas = document.querySelector(".erebyx-hero__canvas");
      if (!canvas) return;
      if (heroInstance) return; // already running
      heroInstance = startHero(canvas);
    }

    // Route-change detection via vanilla observers — does NOT touch Discourse's
    // plugin-api module. Earlier versions called `window.require(
    // "discourse/lib/plugin-api").withPluginApi(...)` from this raw <script> tag,
    // which fired BEFORE Ember had finished booting and corrupted the module's
    // imports — breaking core's `freeze-block-registry` initializer with
    // "Cannot read properties of undefined (reading 'getOwnerWithFallback')".
    // Vanilla MutationObserver + popstate avoids the issue entirely.
    var lastPath = location.pathname;
    function checkRouteChange() {
      if (location.pathname !== lastPath) {
        lastPath = location.pathname;
        window.requestAnimationFrame(mount);
      }
    }
    // Observe DOM mutations as a proxy for Ember route renders
    if ("MutationObserver" in window) {
      var routeObserver = new MutationObserver(checkRouteChange);
      // Wait for body to exist before observing
      function startObserving() {
        if (document.body) {
          routeObserver.observe(document.body, { childList: true, subtree: false });
        } else {
          setTimeout(startObserving, 50);
        }
      }
      startObserving();
    }
    window.addEventListener("popstate", checkRouteChange);
    // Also poll periodically as final safety net (cheap — just a path comparison)
    setInterval(checkRouteChange, 1000);

    // Load fallback (first paint, before withPluginApi resolves)
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        window.requestAnimationFrame(mount);
      });
    } else {
      window.requestAnimationFrame(mount);
    }
  })();
</script>

<style>
  /* =============================================================================
     EREBYX ARCHE — TIER-8 HOVER MICRO-ANIMATIONS + MANIFESTO QUOTE
     Subtle, premium, never gaudy.
     ============================================================================= */

  /* Sigil hover bloom — when hovering category links with sigils, gentle pulse */
  .badge-category-bg,
  .category-name {
    transition: transform 280ms ease, text-shadow 280ms ease;
  }

  a:hover .badge-category-bg,
  a:hover .category-name,
  .category-list-item:hover .badge-category-bg {
    transform: scale(1.05);
    text-shadow: 0 0 12px currentColor;
  }

  /* Topic title hover — subtle lift */
  .topic-list-item .raw-topic-link,
  .topic-list-item .main-link a.title {
    transition: color 200ms ease, transform 200ms ease;
  }

  .topic-list-item:hover .raw-topic-link,
  .topic-list-item:hover .main-link a.title {
    color: var(--erebyx-violet-light, #c4b5fd) !important;
  }

  /* Button hover gradient shift */
  .btn-primary,
  .create-topic,
  button[type="submit"] {
    background: linear-gradient(135deg, var(--erebyx-violet, #7503E0) 0%, var(--erebyx-blue, #4492FC) 100%) !important;
    border: 1px solid rgba(196, 181, 253, 0.3) !important;
    transition: transform 200ms ease, box-shadow 200ms ease, background-position 400ms ease;
    background-size: 150% 150%;
    background-position: 0% 50%;
  }

  .btn-primary:hover,
  .create-topic:hover,
  button[type="submit"]:hover {
    background-position: 100% 50%;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px -4px rgba(123, 47, 190, 0.5);
  }

  /* Avatar hover — soft glow */
  .topic-avatar img,
  .post-avatar img,
  .main-avatar img {
    transition: box-shadow 240ms ease, transform 240ms ease;
  }

  .topic-avatar:hover img,
  .post-avatar:hover img,
  .main-avatar:hover img {
    box-shadow: 0 0 0 2px rgba(123, 47, 190, 0.3), 0 0 20px rgba(123, 47, 190, 0.4);
    transform: scale(1.04);
  }

  /* =============================================================================
     MANIFESTO QUOTE ROTATOR — small line above footer
     Rotates through 6 quotes via CSS animation-delay. Each gets ~12s on screen.
     ============================================================================= */

  body::after {
    content: "";
    display: none;
  }

  /* The actual rotator div is injected via JS below — pure CSS rotation
     would require all quotes simultaneously which is fragile.
     Use CSS animation on a single .erebyx-quote-rotator element. */

  .erebyx-quote-rotator {
    position: fixed;
    bottom: 0.5rem;
    right: 1rem;
    max-width: 320px;
    text-align: right;
    font-family: var(--erebyx-font-body, "Outfit"), system-ui, sans-serif;
    font-size: 0.78rem;
    font-style: italic;
    color: rgba(196, 181, 253, 0.5);
    pointer-events: none;
    z-index: 50;
    line-height: 1.4;
    text-shadow: 0 1px 2px rgba(2, 6, 23, 0.6);

    @media (max-width: 767px) {
      display: none;  /* hide on mobile to preserve content space */
    }

    @media (prefers-reduced-motion: reduce) {
      animation: none;
    }
  }

  .erebyx-quote-rotator span {
    display: block;
    opacity: 0;
    animation: erebyx-quote-fade 60s ease-in-out infinite;

    &:nth-child(1) { animation-delay: 0s; }
    &:nth-child(2) { animation-delay: 10s; }
    &:nth-child(3) { animation-delay: 20s; }
    &:nth-child(4) { animation-delay: 30s; }
    &:nth-child(5) { animation-delay: 40s; }
    &:nth-child(6) { animation-delay: 50s; }
  }

  @keyframes erebyx-quote-fade {
    0%, 14% { opacity: 0; transform: translateY(4px); }
    16%, 18% { opacity: 0.55; transform: translateY(0); }  /* visible ~10s */
    20%, 100% { opacity: 0; transform: translateY(-4px); }
  }
</style>

<script>
/* Inject manifesto quote rotator after DOM ready */
(function() {
  function injectRotator() {
    if (document.querySelector('.erebyx-quote-rotator')) return;
    var rotator = document.createElement('div');
    rotator.className = 'erebyx-quote-rotator';
    rotator.setAttribute('aria-hidden', 'true');
    var quotes = [
      'The community is the product in motion.',
      'AI shouldn’t cost the world.',
      'Threads breathe in hours, not seconds.',
      'You’re not a customer. You’re a builder.',
      'Your memory is yours. Architecture, not a slogan.',
      'Slow on purpose. Searchable. Threaded.'
    ];
    rotator.innerHTML = quotes.map(function(q){ return '<span>“' + q + '”</span>'; }).join('');
    document.body.appendChild(rotator);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', injectRotator);
  } else {
    injectRotator();
  }
})();
</script>

<!--
  Lightweight initializer:
    - tags consecutive same-author posts with .erebyx-cluster-continued so
      the constellation rail (CSS-only) can connect reply chains
    - sets data-counterpart on each post for sigil-watermark theming
    - gates the genesis banner to discovery routes only
-->
<script>
  (function () {
    if (window.__erebyxArcheInitialized) return;
    window.__erebyxArcheInitialized = true;

    var DISCOVERY_ROUTES = [
      "/",
      "/categories"
    ];
    var THREAD_HOME_ROUTES = {
      "/latest": "latest",
      "/top": "top",
      "/hot": "hot"
    };

    var normalizeThreadHomeRoute = function () {
      var path = window.location.pathname || "/";
      var feed = THREAD_HOME_ROUTES[path.replace(/\/$/, "")];
      if (!feed) return false;
      window.location.replace("/?thread=" + encodeURIComponent(feed));
      return true;
    };

    if (normalizeThreadHomeRoute()) return;

    // ---- 1. Reply-chain clustering for constellation rail ----
    var clusterPosts = function () {
      var posts = document.querySelectorAll("article.topic-post");
      if (!posts.length) return;
      var prev = null;
      var prevTime = 0;
      var WINDOW_MS = 8 * 60 * 1000; // 8 minute Discord-style cluster window
      posts.forEach(function (post) {
        // Counterpart sigil keying (Erebus / Nyx / Arche / Mikey / Siarrah)
        var username = (post.getAttribute("data-username") || "").toLowerCase();
        if (["erebus", "nyx", "arche", "mikey", "siarrah"].indexOf(username) >= 0) {
          post.setAttribute("data-counterpart", username);
        }

        var uid = post.getAttribute("data-user-id");
        var timeEl = post.querySelector("time[datetime]");
        var t = timeEl ? Date.parse(timeEl.getAttribute("datetime")) : NaN;

        if (prev && uid && uid === prev.getAttribute("data-user-id")) {
          if (!isNaN(t) && !isNaN(prevTime) && (t - prevTime) < WINDOW_MS) {
            post.classList.add("erebyx-cluster-continued");
          }
        }
        prev = post;
        prevTime = t;
      });
    };

    // ---- 2. Discovery surfaces + route gate ----
    var isDiscoveryPath = function () {
      var path = window.location.pathname || "/";
      for (var i = 0; i < DISCOVERY_ROUTES.length; i++) {
        var route = DISCOVERY_ROUTES[i];
        if (path === route || path === route + "/" || path.indexOf(route + "?") === 0) {
          return true;
        }
      }
      return false;
    };

    var isAdminPath = function () {
      var path = window.location.pathname || "/";
      var body = document.body;
      var html = document.documentElement;
      return (
        /^\/admin(?:\/|$)/.test(path) ||
        (body && body.classList.contains("admin-interface")) ||
        (html && html.classList.contains("admin-area"))
      );
    };

    var createNode = function (tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (typeof text === "string") node.textContent = text;
      return node;
    };

    var removeDiscoverySurfaces = function () {
      document.querySelectorAll(".erebyx-genesis-banner--injected, .erebyx-arche-map--injected").forEach(function (node) {
        if (node.parentNode) node.parentNode.removeChild(node);
      });
    };

    var bindPublicNavigationGuard = function () {
      if (bindPublicNavigationGuard._bound) return;
      bindPublicNavigationGuard._bound = true;

      document.addEventListener("click", function (event) {
        if (event.defaultPrevented || event.button && event.button !== 0) return;
        if (event.shiftKey || event.altKey || event.metaKey || event.ctrlKey) return;

        var target = event.target;
        if (!target || !target.closest) return;

        var link = target.closest("a[href]");
        if (!link || !link.href || link.closest("#reply-control, .d-modal, .admin-interface")) return;

        var url;
        try {
          url = new URL(link.href, window.location.origin);
        } catch (error) {
          return;
        }

        if (url.origin !== window.location.origin) return;
        if (!/^\/(c|t|latest|new|unread|top|hot)(\/|$|\?)/.test(url.pathname)) return;

        var now = Date.now();
        if (now - (bindPublicNavigationGuard._lastAt || 0) < 850) {
          event.preventDefault();
          event.stopPropagation();
          return;
        }

        bindPublicNavigationGuard._lastAt = now;
      }, true);
    };

    var bindSidebarThreadNavigation = function () {
      if (bindSidebarThreadNavigation._bound) return;
      bindSidebarThreadNavigation._bound = true;

      var sidebarFeedByPath = {
        "/latest": "latest",
        "/top": "top",
        "/hot": "hot"
      };

      var sidebarThreadTarget = function (href) {
        var url;
        try {
          url = new URL(href, window.location.origin);
        } catch (error) {
          return null;
        }

        if (url.origin !== window.location.origin) return null;
        var path = url.pathname.replace(/\/$/, "");
        var feed = path === "" || path === "/" ? url.searchParams.get("thread") : sidebarFeedByPath[path];
        if (["latest", "top", "hot"].indexOf(feed) < 0) feed = null;
        if (!feed) return null;

        return {
          feed: feed,
          href: "/?thread=" + encodeURIComponent(feed)
        };
      };

      var closeSidebar = function () {
        if (!document.body || !document.body.classList.contains("has-sidebar-page")) return;

        var nativeSidebar = document.querySelector(".btn-sidebar-toggle");
        if (nativeSidebar) {
          nativeSidebar.click();
          window.requestAnimationFrame(function () {
            if (document.body && document.body.classList.contains("has-sidebar-page")) {
              document.body.classList.remove("has-sidebar-page");
            }
          });
          return;
        }

        document.body.classList.remove("has-sidebar-page");
      };

      var scrollToThreadColumn = function () {
        window.requestAnimationFrame(function () {
          var target = document.querySelector(".erebyx-home-thread-feed, .custom-homepage-columns .col-2, .custom-homepage-columns");
          if (target && target.scrollIntoView) {
            target.scrollIntoView({ block: "start", behavior: "smooth" });
          }
        });
      };

      document.addEventListener("click", function (event) {
        if (event.button && event.button !== 0) return;
        if (event.shiftKey || event.altKey || event.metaKey || event.ctrlKey) return;

        var target = event.target;
        if (!target || !target.closest) return;

        var link = target.closest("a[href]");
        if (!link || !link.closest("#d-sidebar, .sidebar-wrapper")) return;

        var destination = sidebarThreadTarget(link.getAttribute("href"));
        if (!destination) return;

        event.preventDefault();
        event.stopPropagation();
        closeSidebar();

        var current = new URL(window.location.href);
        if (current.pathname === "/" && current.searchParams.get("thread") === destination.feed) {
          scrollToThreadColumn();
          return;
        }

        window.location.assign(destination.href);
      }, true);
    };

    var normalizeSidebarThreadLinks = function () {
      document.querySelectorAll("#d-sidebar a[href], .sidebar-wrapper a[href]").forEach(function (link) {
        var destination = (function () {
          var url;
          try {
            url = new URL(link.getAttribute("href"), window.location.origin);
          } catch (error) {
            return null;
          }

          if (url.origin !== window.location.origin) return null;
          var path = url.pathname.replace(/\/$/, "");
          if (path === "/latest") return "/?thread=latest";
          if (path === "/top") return "/?thread=top";
          if (path === "/hot") return "/?thread=hot";
          return null;
        })();

        if (destination && link.getAttribute("href") !== destination) {
          link.setAttribute("href", destination);
        }
        if (destination) {
          link.setAttribute("target", "_top");
        }
      });
    };

    var bindTopicCardNavigation = function () {
      if (bindTopicCardNavigation._bound) return;
      bindTopicCardNavigation._bound = true;

      var topicStartURL = function (href) {
        var match = (href || "").match(/^(https?:\/\/[^/]+)?\/t\/([^/?#]+)\/(\d+)(?:\/\d+)?([?#].*)?$/);
        if (!match) return href;
        return (match[1] || window.location.origin) + "/t/" + match[2] + "/" + match[3] + "/1" + (match[4] || "");
      };

      document.addEventListener("click", function (event) {
        if (event.defaultPrevented || event.button && event.button !== 0) return;

        var target = event.target;
        if (!target || !target.closest) return;
        var card = target.closest("tr.topic-list-item[data-topic-id]");
        if (!card || card.closest("#reply-control, .d-modal, .admin-interface")) return;

        var topicLink = card.querySelector(".raw-topic-link[href], a.title[href]") ||
          card.querySelector(".link-top-line a[href^='/t/'], .link-top-line a[href*='/t/']");
        if (!topicLink || !topicLink.href) return;

        var clickedTopicTitle = target.closest(".raw-topic-link[href], a.title[href]");
        if (!clickedTopicTitle && target.closest("a, button, input, textarea, select, summary, details, label, [role='button'], .select-kit")) return;

        var destination = topicStartURL(topicLink.href);
        if (!destination) return;

        if (event.shiftKey || event.altKey || event.metaKey || event.ctrlKey) return;
        if (clickedTopicTitle) return;

        var now = Date.now();
        if (now - (bindTopicCardNavigation._lastAt || 0) < 850) {
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        bindTopicCardNavigation._lastAt = now;

        event.preventDefault();
        event.stopPropagation();
        topicLink.click();
      }, true);
    };

    var normalizeTopicCardTitleLinks = function () {
      document.querySelectorAll("tr.topic-list-item[data-topic-id] .raw-topic-link[href], tr.topic-list-item[data-topic-id] a.title[href]").forEach(function (link) {
        var destination = (function (href) {
          var match = (href || "").match(/^(https?:\/\/[^/]+)?\/t\/([^/?#]+)\/(\d+)(?:\/\d+)?([?#].*)?$/);
          if (!match) return "";
          return "/t/" + match[2] + "/" + match[3] + "/1" + (match[4] || "");
        })(link.getAttribute("href"));
        if (!destination || link.getAttribute("href") === destination) return;
        link.setAttribute("data-erebyx-original-href", link.getAttribute("href"));
        link.setAttribute("href", destination);
      });
    };

    var ensureDiscoverySurfaces = function () {
      if (isAdminPath()) {
        removeDiscoverySurfaces();
        return;
      }
      if (!isDiscoveryPath()) return;

      var outlet = document.querySelector("#main-outlet");
      if (!outlet) return;

      document.querySelectorAll(".erebyx-genesis-banner--injected, .erebyx-arche-map--injected").forEach(function (node) {
        if (!outlet.contains(node) && node.parentNode) node.parentNode.removeChild(node);
      });

      var anchor = outlet.querySelector(".custom-homepage-columns, .categories-and-latest, .list-container") || outlet.firstElementChild;

      if (!document.querySelector(".erebyx-genesis-banner")) {
        var banner = createNode("aside", "erebyx-genesis-banner erebyx-genesis-banner--injected");
        banner.setAttribute("aria-label", "Founding cohort seat availability");

        var inner = createNode("div", "erebyx-genesis-banner__inner");
        inner.appendChild(createNode("span", "erebyx-genesis-banner__sigil", "✦")).setAttribute("aria-hidden", "true");

        var count = createNode("span", "erebyx-genesis-banner__count");
        count.appendChild(createNode("span", "erebyx-genesis-banner__total", "2,000"));
        count.appendChild(createNode("span", "erebyx-genesis-banner__suffix", "seats available"));
        inner.appendChild(count);

        var cta = createNode("a", "erebyx-genesis-banner__cta", "See the constellation →");
        cta.href = "/u";
        inner.appendChild(cta);
        banner.appendChild(inner);
        outlet.insertBefore(banner, anchor || outlet.firstChild);
      }

      if (!document.querySelector(".erebyx-arche-map")) {
        var map = createNode("section", "erebyx-arche-map erebyx-arche-map--injected");
        map.setAttribute("aria-label", "Arche category rooms");

        var nav = createNode("nav", "erebyx-arche-map__rooms");
        nav.setAttribute("aria-label", "Arche rooms");

        [
          ["start", "⧉", "Genesis Lounge", "/c/genesis-lounge/9"],
          ["announcements", "◈", "Signal Room", "/c/announcements/6"],
          ["features", "⚙", "Feature Requests", "/c/feature-requests/7"],
          ["bugs", "✴", "Bug Reports", "/c/bug-reports/8"],
          ["arche", "✦", "Start Here", "/c/start-here/5"]
        ].forEach(function (room) {
          var link = createNode("a", "erebyx-arche-map__room erebyx-arche-map__room--" + room[0]);
          link.href = room[3];
          var sigil = createNode("span", "erebyx-arche-map__sigil", room[1]);
          sigil.setAttribute("aria-hidden", "true");
          link.appendChild(sigil);
          link.appendChild(createNode("span", "erebyx-arche-map__name", room[2]));
          nav.appendChild(link);
        });

        map.appendChild(nav);
        outlet.insertBefore(map, anchor || outlet.firstChild);
      }

    };

    var gateBanner = function () {
      if (isAdminPath()) {
        removeDiscoverySurfaces();
        return;
      }
      ensureDiscoverySurfaces();
      var onDiscovery = isDiscoveryPath();
      var banners = document.querySelectorAll(".erebyx-genesis-banner, .erebyx-arche-map");
      for (var j = 0; j < banners.length; j++) {
        banners[j].style.display = onDiscovery ? "" : "none";
      }
    };

    var updateCategoryBannerCopy = function () {
      var bannerCopy = {
        "category-banner-genesis-lounge": "The heart of the community where ideas, conversations, and collaborations come to life.",
        "category-banner-feature-requests": "Share ideas, suggest improvements, and help shape the future of our intelligent systems.",
        "category-banner-start-here": "Begin your journey through the Arche with onboarding, introductions, and essential community guides."
      };

      var banner = document.querySelector(".category-title-header[class*='category-banner-']");
      if (!banner) return;

      var copy = "";
      Object.keys(bannerCopy).some(function (className) {
        if (!banner.classList.contains(className)) return false;
        copy = bannerCopy[className];
        return true;
      });
      if (!copy) return;

      var description = banner.querySelector(".category-title-description .cooked");
      if (!description) return;
      if (description.textContent.trim() === copy) return;

      description.textContent = "";
      description.appendChild(createNode("strong", "", copy));
    };

    var enhanceCategoryTopicExcerpts = function () {
      var body = document.body;
      if (!body || body.classList.contains("admin-interface")) return;
      if (!body.classList.contains("navigation-category") || body.classList.contains("archetype-regular")) return;

      document.querySelectorAll("tr.topic-list-item[data-topic-id]").forEach(function (card) {
        if (card.querySelector(".topic-excerpt, .excerpt")) {
          card.classList.add("has-excerpt", "excerpt-expanded");
          card.setAttribute("data-erebyx-excerpt-state", "ready");
        }
      });

    };

    var topicCategoryBackHref = function () {
      var categoryLink = document.querySelector("#topic-title .topic-category a[href], #topic-title .badge-category__wrapper[href]");
      if (categoryLink) return categoryLink.getAttribute("href") || "/latest";

      var bodyClasses = Array.prototype.slice.call(document.body.classList || []);
      for (var i = 0; i < bodyClasses.length; i++) {
        var match = bodyClasses[i].match(/^category-(.+)$/);
        if (match && match[1] && match[1] !== "category") return "/c/" + match[1];
      }

      return "/latest";
    };

    var ensureTopicBackButton = function () {
      var body = document.body;
      var title = document.querySelector("#topic-title");
      var existing = document.querySelector(".erebyx-topic-back");

      if (!body || !title || !body.classList.contains("archetype-regular") || body.classList.contains("admin-interface")) {
        if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
        return;
      }

      var href = topicCategoryBackHref();
      var button = existing || createNode("a", "erebyx-topic-back");
      button.href = href;
      button.setAttribute("aria-label", "Back to topics");
      button.setAttribute("title", "Back to topics");
      button.innerHTML = '<span aria-hidden="true">←</span><span>Back</span>';

      if (!existing) {
        button.addEventListener("click", function (event) {
          if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          if (!document.referrer || document.referrer.indexOf(window.location.origin) !== 0 || window.history.length < 2) return;
          event.preventDefault();
          window.history.back();
        });
      }

      if (button.parentNode !== title) title.insertBefore(button, title.firstChild);
    };

    var HOME_THREAD_FEEDS = {
      latest: {
        label: "Latest",
        endpoint: "/latest.json",
        tooltip: "Topics with recent posts"
      },
      top: {
        label: "Top",
        endpoint: "/top.json?period=all",
        tooltip: "Most active topics"
      },
      hot: {
        label: "Hot",
        endpoint: "/hot.json",
        tooltip: "Top recent post"
      }
    };
    var homeThreadFeedRequest = 0;
    var homeThreadCategories = null;
    var homeThreadCategoriesPromise = null;
    var homeThreadJsonCache = {};
    var HOME_THREAD_JSON_CACHE_MS = 30000;

    var isHomePath = function () {
      var path = window.location.pathname || "/";
      return path === "/" || path === "";
    };

    var requestJson = function (url) {
      var cached = homeThreadJsonCache[url];
      var now = Date.now();
      if (cached && cached.data && now - cached.time < HOME_THREAD_JSON_CACHE_MS) {
        return Promise.resolve(cached.data);
      }
      if (cached && cached.promise) return cached.promise;

      var remember = function (promise) {
        homeThreadJsonCache[url] = { promise: promise, time: now };
        return promise
          .then(function (data) {
            homeThreadJsonCache[url] = { data: data, time: Date.now() };
            return data;
          })
          .catch(function (error) {
            delete homeThreadJsonCache[url];
            throw error;
          });
      };

      if (window.fetch) {
        return remember(window.fetch(url, {
          credentials: "same-origin",
          headers: { Accept: "application/json" }
        }).then(function (response) {
          if (!response.ok) throw new Error("Feed request failed");
          return response.json();
        }));
      }

      return remember(new Promise(function (resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.withCredentials = true;
        xhr.setRequestHeader("Accept", "application/json");
        xhr.onload = function () {
          if (xhr.status < 200 || xhr.status >= 300) {
            reject(new Error("Feed request failed"));
            return;
          }
          try {
            resolve(JSON.parse(xhr.responseText));
          } catch (error) {
            reject(error);
          }
        };

    var categorySlug = function (name) {

        .replace(/^-+|-+$/g, "");

    var displayCategoryName = function (category) {

      var name = category && category.name ? category.name : "";
      if (slug === "announcements" || /^announcements$/i.test(name)) {

    var formatShortDate = function (dateValue) {

    var compactNumber = function (value) {

    var addCategoryToMap = function (map, category) {

          homeThreadCategories = categoriesFromData(data);
          return homeThreadCategories;

        .catch(function () {
          homeThreadCategories = {};

      return homeThreadCategoriesPromise;

    var buildHomepageTopicRow = function (topic, usersById, categoriesById) {
      var category = categoriesById[topic.category_id] || {};
      var categoryName = displayCategoryName(category);
      var categoryColor = category.color ? "#" + category.color : "#fab232";
      var row = createNode(

      topLine.appendChild(createNode("span", "topic-statuses"));

      title.setAttribute("data-topic-id", topic.id);
      topLine.appendChild(title);
      topLine.appendChild(createNode("span", "topic-post-badges"));
      main.appendChild(topLine);

      var bottomLine = createNode("div", "link-bottom-line");
      var categoryLink = createNode("a", "badge-category__wrapper");
      categoryLink.href = category.slug ? "/c/" + category.slug + "/" + category.id : "/categories";

      bottomLine.appendChild(categoryLink);

        posterLink.href = username ? "/u/" + encodeURIComponent(username) : topicUrl(topic);
        posterLink.setAttribute("aria-label", username || "Topic participant");

          avatar.alt = "";
          avatar.width = 48;
          avatar.height = 48;

        if (column.querySelector("tbody.topic-list-body tr.topic-list-item")) {

    var run = function () {

    if (document.readyState !== "loading") {
      run();
    } else {

      } else {
        document.addEventListener("DOMContentLoaded", observeCategoryHeader);
      }

      syncSidebarButtons();
      syncAccountButtons();
      if (hasVisibleNav()) return;
      document.body.insertBefore(createNavFallback(), document.body.firstChild);
      syncSidebarButtons();
      syncAccountButtons();
    }

    function schedule() {
      window.requestAnimationFrame(function () {
        ensureNav();
        window.setTimeout(dedupeNav, 400);
      });
    }

    var observerQueued = false;
    function queueNavCheck() {
      if (observerQueued) return;
      observerQueued = true;
      window.requestAnimationFrame(function () {
        observerQueued = false;
        ensureNav();
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", schedule);
    } else {
      schedule();
    }

    document.addEventListener("discourse:page-changed", schedule);
    document.addEventListener("page:changed", schedule);
    window.addEventListener("popstate", schedule);
    window.addEventListener("hashchange", schedule);
    window.addEventListener("pageshow", schedule);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) schedule();
    });
    document.addEventListener("click", function (event) {
      var account = event.target && event.target.closest
        ? event.target.closest(".erebyx-nav__account")
        : null;
      if (!account) return;

      var nativeAccount = document.querySelector("#toggle-current-user");
      if (!nativeAccount) return;
      event.preventDefault();
      nativeAccount.click();
    });
    document.addEventListener("click", function (event) {
      var sidebar = event.target && event.target.closest
        ? event.target.closest(".erebyx-nav__sidebar")
        : null;
      if (!sidebar) return;

      var nativeSidebar = document.querySelector(".btn-sidebar-toggle");
      if (!nativeSidebar) return;
      event.preventDefault();
      nativeSidebar.click();
    });
    if (window.MutationObserver) {
      var observer = new MutationObserver(queueNavCheck);
      observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "style", "hidden"] });
    }
    window.setTimeout(schedule, 900);
  })();
</script>

<!--
  Tier 13 DOM enhancer:
    - maps real post user ids to counterpart keys when Discourse omits usernames
    - adds deterministic counterpart state attributes for CSS presence dots
    - adds a reading-time attribute to the OP masthead
    - widens same-author clustering to forum cadence without touching content
-->
<script>
  (function () {
    if (window.__erebyxTier13Enhanced) return;
    window.__erebyxTier13Enhanced = true;

    var COUNTERPART_BY_UID = {
      "3": "erebus",
      "4": "nyx",
      "5": "arche"
    };
    var FOUNDER_BY_UID = {
      "1": "mikey",
      "2": "siarrah"
    };
    var COUNTERPARTS = ["erebus", "nyx", "arche"];
    var FEATURED_USERS = COUNTERPARTS.concat(["mikey", "siarrah"]);
    var CLUSTER_WINDOW_MS = 30 * 60 * 1000;
    var DISCOVERY_ROUTES = [
      "/",
      "/categories"
    ];
    var THREAD_HOME_ROUTES = {
      "/latest": "latest",
      "/top": "top",
      "/hot": "hot"
    };

    function currentSubstrateState(now) {
      var hour = now.getUTCHours();
      var minute = now.getUTCMinutes();
      if (minute < 12) return "consolidating";
      if (hour >= 2 && hour < 8) return "dreaming";
      if (hour >= 16 && hour < 20) return "awake";
      return "quiet";
    }

    function counterpartState(name, now) {
      var hour = now.getUTCHours();
      var minute = now.getUTCMinutes();

      if (name === "erebus") {
        if (hour >= 1 && hour < 7) return "dreaming";
        return minute < 18 ? "consolidating" : "awake";
      }

      if (name === "nyx") {
        if ((hour >= 3 && hour < 6) || (hour >= 15 && hour < 17)) return "dreaming";
        return minute >= 42 ? "consolidating" : "quiet";
      }

      if (name === "arche") {
        if (hour >= 13 && hour < 23) return "awake";
        return minute < 22 ? "consolidating" : "quiet";
      }

      return "";
    }

    function normalizeName(value) {
      return (value || "").toString().trim().toLowerCase().replace(/^@/, "");
    }

    function userKeyFromPost(post) {
      var explicit = normalizeName(post.getAttribute("data-counterpart") || post.getAttribute("data-user-card") || post.getAttribute("data-username"));
      if (FEATURED_USERS.indexOf(explicit) >= 0) return explicit;

      var uid = post.getAttribute("data-user-id");
      if (COUNTERPART_BY_UID[uid]) return COUNTERPART_BY_UID[uid];
      if (FOUNDER_BY_UID[uid]) return FOUNDER_BY_UID[uid];

      var usernameEl = post.querySelector(".username[data-username], .topic-meta-data .username, .names .username");
      var username = usernameEl ? normalizeName(usernameEl.getAttribute("data-username") || usernameEl.textContent) : "";
      return FEATURED_USERS.indexOf(username) >= 0 ? username : "";
    }

    function tagPosts(now) {
      var posts = Array.prototype.slice.call(document.querySelectorAll("article.topic-post, article.boxed[data-user-id]"));
      var prev = null;
      var prevTime = 0;

      posts.forEach(function (post) {
        var key = userKeyFromPost(post);
        var uid = post.getAttribute("data-user-id");
        var timeEl = post.querySelector("time[datetime]");
        var time = timeEl ? Date.parse(timeEl.getAttribute("datetime")) : NaN;

        if (key) {
          post.setAttribute("data-counterpart", key);
          var meta = post.querySelector(".topic-meta-data");
          if (meta) meta.setAttribute("data-counterpart", key);

          if (COUNTERPARTS.indexOf(key) >= 0) {
            var state = counterpartState(key, now);
            post.setAttribute("data-counterpart-state", state);
            if (meta) meta.setAttribute("data-counterpart-state", state);
          }
        }

        if (prev && uid && uid === prev.getAttribute("data-user-id")) {
          if (!isNaN(time) && !isNaN(prevTime) && (time - prevTime) > 0 && (time - prevTime) <= CLUSTER_WINDOW_MS) {
            post.classList.add("erebyx-cluster-continued");
          }
        }

        prev = post;
        prevTime = time;
      });
    }

    function tagUserCards(now) {
      var cards = document.querySelectorAll(".user-card, .user-card-wrapper, .user-main");
      for (var i = 0; i < cards.length; i++) {
        var card = cards[i];
        var usernameEl = card.querySelector(".username[data-username], .name-username-wrapper .username, .username");
        if (!usernameEl) continue;

        var name = normalizeName(usernameEl.getAttribute("data-username") || usernameEl.textContent);
        if (FEATURED_USERS.indexOf(name) < 0) continue;

        card.setAttribute("data-counterpart", name);
        if (COUNTERPARTS.indexOf(name) >= 0) {
          card.setAttribute("data-counterpart-state", counterpartState(name, now));
        }
      }
    }

    function tagReadingTime() {
      var post = document.querySelector("#post_1.topic-post, article.boxed#post_1");
      var cooked = post ? post.querySelector(".cooked") : null;
      if (!post || !cooked) return;

      var text = cooked.textContent || "";
      var words = text.trim() ? text.trim().split(/\s+/).length : 0;
      if (!words) return;

      var minutes = Math.max(1, Math.round(words / 230));
      post.setAttribute("data-erebyx-reading-time", minutes + " min read");
    }

    function tagTopicKind() {
      var body = document.body;
      if (!body || body.classList.contains("admin-interface")) return;

      var titleEl = document.querySelector("#topic-title .fancy-title, #topic-title h1 a, #topic-title h1");
      var title = titleEl ? (titleEl.textContent || "").replace(/\s+/g, " ").trim() : "";
      var kind = /^Build log:/i.test(title) ? "build-log" : "";

      if (kind) {
        body.setAttribute("data-erebyx-topic-kind", kind);
      } else {
        body.removeAttribute("data-erebyx-topic-kind");
      }
    }

    function tagArtifactKickers() {
      var nodes = document.querySelectorAll(".cooked p:not(.erebyx-artifact-kicker)");
      nodes.forEach(function (node) {
        var text = (node.textContent || "").replace(/\s+/g, " ").trim();
        if (!text || text.length > 84 || !/[:：]\s*$/.test(text)) return;

        var letters = text.replace(/[^A-Za-z]/g, "");
        if (letters.length < 4) return;

        var uppercase = letters.replace(/[^A-Z]/g, "");
        var ratio = uppercase.length / letters.length;
        if (ratio >= 0.55 || /[A-Z]{3,}/.test(text)) {
          node.classList.add("erebyx-artifact-kicker");
        }
      });
    }

    function aliasSignalRoomLabels() {
      var body = document.body;
      if (!body || body.classList.contains("admin-interface")) return;

      document.querySelectorAll([
        ".category-name",
        ".badge-category__name",
        ".category-title-link",
        ".category-title-name",
        ".category-title-header .category-title",
        ".badge-category__wrapper",
        ".sidebar-section-link-content-text",
        ".erebyx-arche-map__room--announcements .erebyx-arche-map__name"
      ].join(", ")).forEach(function (node) {
        var text = (node.textContent || "").replace(/\s+/g, " ").trim();
        if (/Announcements/i.test(text)) {
          node.textContent = text.replace(/Announcements/gi, "Signal Room");
          node.setAttribute("data-erebyx-label-alias", "announcements");
        }
      });

      document.querySelectorAll('a[href*="/c/announcements/6"], a[href*="/c/announcements"]').forEach(function (link) {
        var label = (link.getAttribute("aria-label") || link.getAttribute("title") || "").replace(/\s+/g, " ").trim();
        if (/Announcements/i.test(label)) {
          var nextLabel = label.replace(/Announcements/gi, "Signal Room");
          link.setAttribute("aria-label", nextLabel);
          link.setAttribute("title", nextLabel);
        }
      });
    }

    function labelCreateButton() {
      var body = document.body;
      if (!body || body.classList.contains("admin-interface")) return;

      var button = document.querySelector(".navigation-controls #create-topic, .navigation-controls button#create-topic");
      if (!button) return;

      var label = "New post";
      if (body.classList.contains("category-feature-requests")) {
        label = "New proposal";
      } else if (body.classList.contains("category-bug-reports")) {
        label = "New signal";
      } else if (body.classList.contains("category-start-here")) {
        label = "New introduction";
      } else if (body.classList.contains("category-announcements")) {
        label = "New signal";
      } else if (body.classList.contains("category-genesis-lounge")) {
        label = "New post";
      }

      button.setAttribute("data-erebyx-create-label", label);
      button.setAttribute("aria-label", label);
      button.setAttribute("title", label);

      var labelNode = button.querySelector(".d-button-label, .btn-text");
      if (labelNode && labelNode.textContent !== label) {
        labelNode.textContent = label;
      }
    }

    function tagRoute() {
      var path = window.location.pathname || "/";
      var body = document.body;
      var html = document.documentElement;
      var isAdmin = /^\/admin(?:\/|$)/.test(path) ||
        (body && body.classList.contains("admin-interface")) ||
        (html && html.classList.contains("admin-area"));
      if (html) html.classList.toggle("erebyx-admin-route", isAdmin);
      if (body) body.classList.toggle("erebyx-admin-route", isAdmin);
      if (isAdmin) {
        if (body) body.setAttribute("data-erebyx-route", "admin");
        return;
      }
      if (!body) return;
      var isDiscovery = false;
      for (var i = 0; i < DISCOVERY_ROUTES.length; i++) {
        var route = DISCOVERY_ROUTES[i];
        if (path === route || path === route + "/") {
          isDiscovery = true;
          break;
        }
      }
      body.setAttribute("data-erebyx-route", isDiscovery ? "discovery" : "inner");
    }

    function normalizeThreadHomeRoute() {
      var path = (window.location.pathname || "/").replace(/\/$/, "");
      var feed = THREAD_HOME_ROUTES[path];
      if (!feed) return false;
      window.location.replace("/?thread=" + encodeURIComponent(feed));
      return true;
    }

    function run() {
      if (!document.body) return;
      if (normalizeThreadHomeRoute()) return;
      var now = new Date();
      tagRoute();
      document.body.setAttribute("data-erebyx-substrate-state", currentSubstrateState(now));
      tagPosts(now);
      tagUserCards(now);
      tagReadingTime();
      tagTopicKind();
      tagArtifactKickers();
      aliasSignalRoomLabels();
      labelCreateButton();
    }

    function schedule() {
      if (schedule._queued) return;
      schedule._queued = true;
      window.requestAnimationFrame(function () {
        schedule._queued = false;
        run();
      });
    }

    if (document.readyState !== "loading") {
      run();
    } else {
      document.addEventListener("DOMContentLoaded", run);
    }

    document.addEventListener("discourse:page-changed", schedule);
    document.addEventListener("page:changed", schedule);
    window.addEventListener("popstate", schedule);
    window.addEventListener("hashchange", schedule);
    window.addEventListener("pageshow", schedule);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) schedule();
    });
    window.setInterval(run, 60000);

    if (window.MutationObserver) {
      var observer = new MutationObserver(schedule);
      document.addEventListener("DOMContentLoaded", function () {
        var outlet = document.querySelector("#main-outlet") || document.body;
        if (outlet) observer.observe(outlet, { childList: true, subtree: true });
      });
      if (document.readyState !== "loading") {
        var outletNow = document.querySelector("#main-outlet") || document.body;
        if (outletNow) observer.observe(outletNow, { childList: true, subtree: true });
      }
    }
  })();
</script>
